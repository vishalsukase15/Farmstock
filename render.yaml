services:
  - type: web
    name: farmstock-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DATABASE_URL
        fromDatabase:
          name: farmstock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://farmstock-app.vercel.app

databases:
  - name: farmstock-db
    databaseName: farmstock
    user: farmstock_user
    plan: free
    region: singapore
